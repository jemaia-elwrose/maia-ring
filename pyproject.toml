[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maia-ring"
version = "0.1.1"
description = "Shared-memory frame ring: pass video frames between processes without copying them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jema" }]
keywords = ["shared-memory", "zero-copy", "video", "ring-buffer", "computer-vision", "video-analytics"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.5"]

[project.scripts]
maia-ring = "maia_ring.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maia_ring"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B904"]
