name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]     # x86 Linux and ARM macOS: different memory ordering
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github . && ruff format --check --diff .
      - name: Test
        run: pytest -q -s
      - name: Benchmark
        run: maia-ring bench -n 100
